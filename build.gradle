        }''')
        cmdgen = cmdgen.replace('''        if (count != 0) {
            uint tp = atomicAdd(translucentDrawCount, 1)+TRANSLUCENT_WRITE_BASE;''', '''        if (count != 0) {
            atomicAdd(voxyDrawCounters[5], 1u);
            atomicAdd(voxyDrawCounters[7], 1u);
            uint tp = atomicAdd(translucentDrawCount, 1)+TRANSLUCENT_WRITE_BASE;''')
        cmdgen = cmdgen.replace('''        ptr += count;

    }
}''', '''        ptr += count;

    } else {
        atomicAdd(voxyDrawCounters[2], 1u);
