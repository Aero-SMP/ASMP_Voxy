    outputs.dir generatedDebugResources

    doLast {
        File outputRoot = generatedDebugResources.get().asFile
        project.delete(outputRoot)

        File processedMetadata = sourceSets.main.output.resourcesDir.toPath()
                .resolve('META-INF/neoforge.mods.toml').toFile()
        File debugMetadata = outputRoot.toPath().resolve('META-INF/neoforge.mods.toml').toFile()
        debugMetadata.parentFile.mkdirs()
        debugMetadata.text = processedMetadata.getText('UTF-8') +
                '\n[[mixins]]\nconfig="debug.voxy.mixins.json"\n'

        File traversalSource = file('src/main/resources/assets/voxy/shaders/lod/hierarchical/traversal.comp')
        String traversal = traversalSource.getText('UTF-8')
        String traversalDeclaration = '''layout(binding = RENDER_TRACKER_BINDING, std430) restrict writeonly buffer renderTrackerArray {
    uint[] lastRenderFrame;
};'''
        String traversalAuditDeclaration = traversalDeclaration + '''

// VOXY_DEBUG_LOD_AUDIT_BEGIN
#define VOXY_AUDIT_COUNTER_COUNT 64u
#define VOXY_AUDIT_ANOMALY_CAPACITY 128u
#define VOXY_AUDIT_FRONTIER_CAPACITY 2048u
layout(binding = 15, std430) restrict buffer VoxyLodAuditBuffer {
    uint voxyAuditCounters[64];
    uvec4 voxyAuditAnomalies[128];
    uvec2 voxyAuditFrontier[2048];
};

void voxyAuditHash(uvec2 rawPos) {
    atomicXor(voxyAuditCounters[21], rawPos.x * 0x9e3779b9u + rawPos.y);
    atomicXor(voxyAuditCounters[22], rawPos.y * 0x85ebca6bu + rawPos.x);
    atomicAdd(voxyAuditCounters[23], rawPos.x * 0xc2b2ae35u ^ rawPos.y);
    atomicAdd(voxyAuditCounters[24], rawPos.y * 0x27d4eb2fu ^ rawPos.x);
}

void voxyAuditAnomaly(in UnpackedNode node, uint reason, float ratio) {
    uint index = atomicAdd(voxyAuditCounters[31], 1u);
    if (index < VOXY_AUDIT_ANOMALY_CAPACITY) {
        uint flags = (hasRequested(node) ? 1u : 0u)
                | (isTerminal(node) ? 2u : 0u)
                | (hasChildren(node) ? 4u : 0u)
                | (hasMesh(node) ? 8u : 0u)
                | (isEmptyMesh(node) ? 16u : 0u);
        voxyAuditAnomalies[index] = uvec4(node.rawPos,
                (reason & 0xffu) | ((node.lodLevel & 0xfu) << 8) | (flags << 12),
                floatBitsToUint(ratio));
    }
}

void voxyAuditSelected(in UnpackedNode node) {
    atomicAdd(voxyAuditCounters[16 + min(node.lodLevel, 4u)], 1u);
    voxyAuditHash(node.rawPos);
    if (voxyAuditCounters[63] != 0u) {
        uint index = atomicAdd(voxyAuditCounters[30], 1u);
        if (index < VOXY_AUDIT_FRONTIER_CAPACITY) voxyAuditFrontier[index] = node.rawPos;
    }
}
// VOXY_DEBUG_LOD_AUDIT_END'''
        if (!traversal.contains(traversalDeclaration)) {
            throw new GradleException('Traversal shader audit declaration anchor changed')
        }
        traversal = traversal.replace(traversalDeclaration, traversalAuditDeclaration)
        traversal = traversal.replace('''void addRequest(inout UnpackedNode node) {
    if (!hasRequested(node)) {
        if (requestQueueIndex.x < requestQueueSize) {//Soft limit''', '''void addRequest(inout UnpackedNode node) {
    if (hasRequested(node)) {
        atomicAdd(voxyAuditCounters[8], 1u);
    } else {
        if (requestQueueIndex.x < requestQueueSize) {//Soft limit
            atomicAdd(voxyAuditCounters[9], 1u);''')
        traversal = traversal.replace('''            }
        }
    }
}

void enqueueChildren''', '''            }
        } else {
            atomicAdd(voxyAuditCounters[10], 1u);
        }
    }
}

void enqueueChildren''')
        traversal = traversal.replace('''                markRequested(node);
            }
        } else {''', '''                markRequested(node);
            } else {
                atomicAdd(voxyAuditCounters[25], 1u);
            }
        } else {''')
        traversal = traversal.replace('''    uint children = getChildCount(node);
    pushNodesInit(children);''', '''    uint children = getChildCount(node);
    pushNodesInit(children);
    if (nodePushIndex + children > 200000u) {
        atomicAdd(voxyAuditCounters[15], 1u);
    }''')
        traversal = traversal.replace('''void enqueueSelfForRender(in UnpackedNode node) {
    if (renderQueueIndex < renderQueueMaxSize) {''', '''void enqueueSelfForRender(in UnpackedNode node) {
    voxyAuditSelected(node);
    if (renderQueueIndex < renderQueueMaxSize) {''')
        traversal = traversal.replace('''            }
        }
    }
}


vec3 closestPointToCamera''', '''            }
        }
    } else {
        atomicAdd(voxyAuditCounters[14], 1u);
    }
}


vec3 closestPointToCamera''')
        traversal = traversal.replace('''void traverse(in UnpackedNode node) {
    //Compute screenspace
    setupScreenspace(node);

    if (!(outsideFrustum() || isCulledByHiz())) {''', '''void traverse(in UnpackedNode node) {
    //Compute screenspace
    setupScreenspace(node);

    if (outsideFrustum()) {
        atomicAdd(voxyAuditCounters[2], 1u);
        return;
    }
    if (isCulledByHiz()) {
        atomicAdd(voxyAuditCounters[3], 1u);
        return;
    }
    atomicAdd(voxyAuditCounters[4], 1u);
    {''')
        traversal = traversal.replace('''        if (node.lodLevel!=0 && !isTerminal(node) && shouldDecend()) {
            if (hasChildren(node)) {
                enqueueChildren(node);
            } else {
                addRequest(node);''', '''        if (node.lodLevel!=0 && !isTerminal(node) && shouldDecend()) {
            atomicAdd(voxyAuditCounters[5], 1u);
            if (hasChildren(node)) {
                atomicAdd(voxyAuditCounters[6], 1u);
                enqueueChildren(node);
            } else {
                atomicAdd(voxyAuditCounters[7], 1u);
                voxyAuditAnomaly(node, 1u, _screenSize / max(minSSS, 0.0000001f));
                addRequest(node);''')
        traversal = traversal.replace('''                // Keep the coarse node visible until the requested children are available.
                // The node already passed render-distance, frustum and HiZ rejection above.
                enqueueSelfForRender(node);''', '''                // Keep the coarse node visible until the requested children are available.
                // The node already passed render-distance, frustum and HiZ rejection above.
                atomicAdd(voxyAuditCounters[12], 1u);
                enqueueSelfForRender(node);''')
