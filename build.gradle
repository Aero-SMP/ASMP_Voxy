tasks.register('verifyClientOwnershipArtifacts') {
    dependsOn 'jar', 'debugJar'
    doLast {
        [tasks.named('jar', Jar).get(), tasks.named('debugJar', Jar).get()].each { task ->
            def artifact = task.archiveFile.get().asFile
            if (!zipTree(artifact).matching {
                include '**/*BehaviorTest*', '**/OwnerEfficiencyBehaviorTest*', '**/DetailBatchBehaviorTest*'
            }.files.empty) throw new GradleException('Ownership fixtures leaked into ' + artifact)
        }
        def normal = tasks.named('jar', Jar).get().archiveFile.get().asFile
        if (!zipTree(normal).matching {
            include '**/OwnerLoadingTelemetry*', '**/SessionDebugTelemetry*', '**/LiveClientTestHarness*'
        }.files.empty) throw new GradleException('Debug telemetry leaked into ' + normal)
    }
}
