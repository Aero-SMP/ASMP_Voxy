tasks.register('verifyDebugHarnessArtifacts') {
    description = 'Prove test-control classes occur only in debug artifacts'
    dependsOn tasks.named('buildAll')
    doLast {
        def forbiddenPrefix = 'me/cortex/voxy/debugtest/'
        def clientNormal = tasks.named('jar', Jar).get().archiveFile.get().asFile
        def clientDebug = tasks.named('debugJar', Jar).get().archiveFile.get().asFile
        def serverNormal = project(':server').tasks.named('jar', Jar).get().archiveFile.get().asFile
        def serverDebug = project(':server').tasks.named('debugJar', Jar).get().archiveFile.get().asFile
        [clientNormal, clientDebug].each { artifact ->
            if (zipTree(artifact).matching { include '**/okzoomer/MixinZoomUtils.class' }.files.empty
                    || !zipTree(artifact).matching { include 'client.voxy.mixins.json' }
                        .singleFile.text.contains('okzoomer.MixinZoomUtils')) {
                throw new GradleException("production zoom limit mixin missing from ${artifact}")
            }
            if (!zipTree(artifact).matching { include 'page/langeweile/**', 'org/quiltmc/**' }.files.empty) {
                throw new GradleException("compile-only zoom dependency bundled in ${artifact}")
            }
        }
        [clientNormal, serverNormal].each { artifact ->
            def leaked = zipTree(artifact).matching {
                include forbiddenPrefix + '**'
                include '**/LiveClientTestHarness*', '**/LiveServerTestHarness*', '**/LivePressureRoutes*'
                include '**/SessionDebugTelemetry*'
                include '**/WorkerDebugTelemetry*', '**/ShaderDebugTelemetry*'
                include '**/TransportDebugTelemetry*'
                include '**/DebugCacheTestProfile*'
                include '**/DebugZoomControl*', '**/debugmixin/**', 'debug.voxy.mixins.json'
            }.files
            if (!leaked.empty) throw new GradleException("debug-test protocol leaked into ${artifact}")
            if (zipTree(artifact).matching { include 'META-INF/neoforge.mods.toml' }
                    .singleFile.text.contains('debug.voxy.mixins.json')) {
                throw new GradleException("debug mixin registration leaked into ${artifact}")
            }
        }
        [clientDebug, serverDebug].each { artifact ->
            def protocol = zipTree(artifact).matching { include forbiddenPrefix + '**' }.files
            if (protocol.empty) throw new GradleException("debug-test protocol missing from ${artifact}")
        }
        [clientNormal, serverNormal, clientDebug, serverDebug].each { artifact ->
            if (!zipTree(artifact).matching {
                include '**/*BehaviorTest*'
            }.files.empty) {
                throw new GradleException("offline behavior tests leaked into ${artifact}")
            }
        }
        if (!zipTree(clientDebug).matching {
            include 'me/cortex/voxy/client/lod/LiveClientTestHarness.class'
        }.files.size()) throw new GradleException('debug client harness class is missing')
        if (zipTree(clientDebug).matching { include 'debug.voxy.mixins.json' }.files.empty
                || !zipTree(clientDebug).matching { include 'META-INF/neoforge.mods.toml' }
                    .singleFile.text.contains('config="debug.voxy.mixins.json"')) {
            throw new GradleException('debug zoom mixins are not registered')
        }
        if (!zipTree(serverDebug).matching {
            include 'me/cortex/voxy/server/LiveServerTestHarness.class'
        }.files.size()) throw new GradleException('debug server harness class is missing')
    }
}

tasks.register('verifyServerDiagnosticsArtifacts') {
    description = 'Prove separate native embedding and compile-time exclusion of pressure diagnostics'
    dependsOn ':server:jar', ':server:debugJar'
    doLast {
        def reports = []
        [false, true].each { debug ->
            def artifact = project(':server').tasks.named(debug ? 'debugJar' : 'jar', Jar).get().archiveFile.get().asFile
            def standalone = file('rust-server/target/' + (debug ? 'debug-diagnostics' : 'normal') + '/release/voxy-rust-server')
            byte[] embedded
            new java.util.zip.ZipFile(artifact).withCloseable { zip ->
                def entries = java.util.Collections.list(zip.entries())
                def natives = entries.findAll { it.name == 'native/linux-x86_64/voxy-rust-server' }
                if (natives.size() != 1) throw new GradleException("expected one native member in ${artifact}")
                embedded = zip.getInputStream(natives[0]).withCloseable { it.readAllBytes() }
                def pressure = entries.findAll { it.name.startsWith('me/cortex/voxy/server/LivePressureRoutes') }
                if (pressure.empty == debug) throw new GradleException("pressure-class inclusion mismatch in ${artifact}")
            }
            if (!java.util.Arrays.equals(embedded, standalone.bytes)) {
                throw new GradleException("embedded native differs from standalone ${standalone}")
            }
            def nativeText = new String(embedded, java.nio.charset.StandardCharsets.ISO_8859_1)
            ['VOXY_DEBUG_EPOCH ', 'VOXY_DEBUG_RESPONSE ', 'VOXY_DEBUG_TIMINGS '].each { marker ->
                if (nativeText.contains(marker) != debug) throw new GradleException("diagnostic marker ${marker} mismatch in ${artifact}")
            }
            reports.add([debug: debug, artifact: artifact.absolutePath, standalone: standalone.absolutePath,
                    nativeSha256: java.util.HexFormat.of().formatHex(java.security.MessageDigest.getInstance('SHA-256').digest(embedded)),
                    jarSha256: java.util.HexFormat.of().formatHex(java.security.MessageDigest.getInstance('SHA-256').digest(artifact.bytes)),
                    feature: debug ? 'debug-diagnostics' : 'none'])
        }
        def report = layout.buildDirectory.file('reports/server-diagnostics-artifacts.json').get().asFile
        report.parentFile.mkdirs()
        report.text = groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(reports)) + '\n'
    }
}

