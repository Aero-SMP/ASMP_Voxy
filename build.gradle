plugins {
    id 'net.neoforged.moddev' version '2.0.141'
}

def modVersion = providers.gradleProperty('mod_version').get()
def minecraftVersion = providers.gradleProperty('minecraft_version').get()
def neoForgeVersion = providers.gradleProperty('neoforge_version').get()
def modId = providers.gradleProperty('mod_id').get()
def modName = providers.gradleProperty('mod_name').get()

group = providers.gradleProperty('maven_group').get()
version = "${modVersion}+${minecraftVersion}-neoforge"

base {
    archivesName.set("ASMP_${modId}")
}

allprojects { project ->
    project.plugins.withId('java') {
        def testSources = project.sourceSets.findByName('test')
        if (testSources != null) project.sourceSets.remove(testSources)
        ['test', 'testClasses', 'compileTestJava', 'processTestResources'].each { name ->
            def task = project.tasks.findByName(name)
            if (task != null) task.enabled = false
        }
    }
}

repositories {
    mavenCentral()
    maven { url = 'https://maven.caffeinemc.net/releases' }
    exclusiveContent {
        forRepository {
            maven {
                name = 'Modrinth'
                url = 'https://api.modrinth.com/maven'
            }
        }
        filter {
            includeGroup 'maven.modrinth'
        }
    }

    exclusiveContent {
        forRepository {
            ivy {
                name = 'GitHub releases'
                url = 'https://github.com/'
                patternLayout {
                    artifact '/[organisation]/[module]/releases/download/[revision]/[module]-[revision]-[classifier].[ext]'
                }
                metadataSources {
                    artifact()
                }
            }
        }
        filter {
            includeModuleByRegex '[^\\.]+', 'nvidium'
        }
    }
}

java {
    toolchain.languageVersion.set(JavaLanguageVersion.of(21))
}

sourceSets.main.java.srcDir 'shared/src/main/java'

sourceSets {
    debug {
        java.srcDirs = ['src/debug/java', 'shared/src/debug/java']
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
    }
    debugHarnessTest {
        java.srcDirs = ['shared/src/debugTest/java']
        compileClasspath += sourceSets.debug.output + sourceSets.debug.compileClasspath
        runtimeClasspath += output + compileClasspath
    }
}

configurations {
    clientEmbedded {
        canBeConsumed = false
        canBeResolved = true
        transitive = false
    }
}

tasks.withType(JavaCompile).configureEach {
    options.release.set(21)
}

tasks.named('processResources') {
    def commit = providers.exec {
        commandLine 'git', 'rev-parse', '--short', 'HEAD'
        ignoreExitValue = true
    }.standardOutput.asText.get().trim()
    if (commit.isEmpty()) {
        commit = '<UnknownCommit>'
    }

    def resourceProperties = [
        version  : modVersion,
        minecraft: minecraftVersion,
        neoforge : neoForgeVersion,
        commit   : commit,
        mod_name : modName,
        mod_id   : modId,
    ]
    inputs.properties(resourceProperties)

    filesMatching('META-INF/neoforge.mods.toml') {
        expand resourceProperties
    }
}

dependencies {
    def sodiumVersion = providers.gradleProperty('sodium_version').get()
    def lwjglZstd = 'org.lwjgl:lwjgl-zstd:3.3.3'
    def kwikVersion = '0.10.10'
    compileOnly "net.caffeinemc:sodium-neoforge-mod:${sodiumVersion}"
    compileOnly "net.caffeinemc:sodium-neoforge-api:${sodiumVersion}"
    runtimeOnly("net.caffeinemc:sodium-neoforge:${sodiumVersion}") {
        transitive = false
    }

    compileOnly "drouarb:nvidium:${providers.gradleProperty('nvidium_version').get()}"
    compileOnly "maven.modrinth:iris:${providers.gradleProperty('iris_version').get()}"
    compileOnly lwjglZstd
    clientEmbedded lwjglZstd
    ['natives-linux', 'natives-linux-arm32', 'natives-linux-arm64',
     'natives-macos', 'natives-macos-arm64',
     'natives-windows', 'natives-windows-arm64', 'natives-windows-x86'].each { classifier ->
        clientEmbedded "${lwjglZstd}:${classifier}"
    }

    compileOnly "tech.kwik:kwik:${kwikVersion}"
    clientEmbedded "tech.kwik:kwik:${kwikVersion}"
    clientEmbedded 'tech.kwik:agent15:3.2'
    clientEmbedded 'at.favre.lib:hkdf:2.0.0'
    clientEmbedded 'io.whitfin:siphash:3.0.0'
}

def addEmbeddedClientClasses = { Jar task ->
    task.from({ configurations.clientEmbedded.collect { zipTree(it) } }) {
        include 'org/lwjgl/util/zstd/**', 'linux/**', 'macos/**', 'windows/**',
                'META-INF/linux/**', 'META-INF/macos/**', 'META-INF/windows/**',
                'tech/kwik/**', 'at/favre/lib/hkdf/**', 'io/whitfin/siphash/**'
        exclude 'module-info.class', 'META-INF/MANIFEST.MF', 'META-INF/*.SF',
                'META-INF/*.RSA', 'META-INF/*.DSA'
    }
    task.duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

tasks.named('jar', Jar) { task ->
    addEmbeddedClientClasses(task)
}

tasks.register('debugJar', Jar) {
    description = 'Build the client JAR with local pipeline diagnostics enabled'
    archiveClassifier.set('debug')
    manifest.attributes('Implementation-Version': modVersion)
    from(sourceSets.main.output) {
        exclude 'me/cortex/voxy/client/lod/ClientLodDebug.class'
    }
    from sourceSets.debug.output
    addEmbeddedClientClasses(delegate)
}

tasks.named('assemble') {
    dependsOn tasks.named('debugJar')
}

neoForge {
    version = neoForgeVersion
    accessTransformers.from 'src/main/resources/META-INF/accesstransformer.cfg'
    validateAccessTransformers = true

    runs {
        register('client') {
            gameDirectory = file('run/')
            client()
        }
    }

    mods {
        register(modId) {
            sourceSet sourceSets.main
        }
    }

}

tasks.register('buildRustServer', Exec) {
    description = 'Build the QUIC Rust backend embedded in the server-controller JAR'
    workingDir 'rust-server'
    commandLine 'cargo', 'build', '--release', '--locked', '--bin', 'voxy-rust-server'
    inputs.files 'rust-server/Cargo.toml', 'rust-server/Cargo.lock'
    inputs.dir 'rust-server/src'
    outputs.file 'rust-server/target/release/voxy-rust-server'
}

tasks.register('buildAll') {
    group = 'build'
    description = 'Assemble normal/debug clients and normal/debug bundled server JARs'
    dependsOn tasks.named('jar'), tasks.named('debugJar'), ':server:jar', ':server:debugJar'
}

tasks.register('debugHarnessJavaTest', JavaExec) {
    description = 'Run fixed-codec and bounded debug-harness ownership tests'
    dependsOn tasks.named('debugHarnessTestClasses')
    classpath = sourceSets.debugHarnessTest.runtimeClasspath
    mainClass.set('me.cortex.voxy.debugtest.DebugHarnessBehaviorTest')
}

tasks.register('debugHarnessPythonTest', Exec) {
    description = 'Run declarative live-test runner behavior tests'
    commandLine 'python3', '-m', 'unittest', 'tools/test_run_live_client_test.py'
}

tasks.register('verifyDebugHarnessArtifacts') {
    description = 'Prove test-control classes occur only in debug artifacts'
    dependsOn tasks.named('buildAll')
    doLast {
        def forbiddenPrefix = 'me/cortex/voxy/debugtest/'
        def clientNormal = tasks.named('jar', Jar).get().archiveFile.get().asFile
        def clientDebug = tasks.named('debugJar', Jar).get().archiveFile.get().asFile
        def serverNormal = project(':server').tasks.named('jar', Jar).get().archiveFile.get().asFile
        def serverDebug = project(':server').tasks.named('debugJar', Jar).get().archiveFile.get().asFile
        [clientNormal, serverNormal].each { artifact ->
            def leaked = zipTree(artifact).matching { include forbiddenPrefix + '**' }.files
            if (!leaked.empty) throw new GradleException("debug-test protocol leaked into ${artifact}")
        }
        [clientDebug, serverDebug].each { artifact ->
            def protocol = zipTree(artifact).matching { include forbiddenPrefix + '**' }.files
            if (protocol.empty) throw new GradleException("debug-test protocol missing from ${artifact}")
        }
        if (!zipTree(clientDebug).matching {
            include 'me/cortex/voxy/client/lod/LiveClientTestHarness.class'
        }.files.size()) throw new GradleException('debug client harness class is missing')
        if (!zipTree(serverDebug).matching {
            include 'me/cortex/voxy/server/LiveServerTestHarness.class'
        }.files.size()) throw new GradleException('debug server harness class is missing')
    }
}

tasks.register('testLiveHarness') {
    group = 'verification'
    description = 'Run all offline live-client harness gates'
    dependsOn tasks.named('debugHarnessJavaTest'), tasks.named('debugHarnessPythonTest'),
            tasks.named('verifyDebugHarnessArtifacts')
}
