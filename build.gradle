import org.gradle.api.tasks.bundling.Jar
import org.gradle.api.tasks.compile.JavaCompile

plugins {
    id 'net.neoforged.moddev' version '2.0.141'
}

def modVersion = providers.gradleProperty('mod_version').get()
def minecraftVersion = providers.gradleProperty('minecraft_version').get()
def neoForgeVersion = providers.gradleProperty('neoforge_version').get()
def modId = providers.gradleProperty('mod_id').get()
def modName = providers.gradleProperty('mod_name').get()

group = providers.gradleProperty('maven_group').get()
version = "${modVersion}+${minecraftVersion}-neoforge"

base {
    archivesName.set("ASMP_${modId}")
}

repositories {
    mavenCentral()
    maven { url = 'https://maven.caffeinemc.net/releases' }
    maven { url = 'https://maven.shedaniel.me/' }
    maven { url = 'https://maven.terraformersmc.com/releases/' }
    exclusiveContent {
        forRepository {
            maven {
                name = 'Modrinth'
                url = 'https://api.modrinth.com/maven'
            }
        }
        filter {
            includeGroup 'maven.modrinth'
        }
    }

    exclusiveContent {
        forRepository {
            ivy {
                name = 'GitHub releases'
                url = 'https://github.com/'
                patternLayout {
                    artifact '/[organisation]/[module]/releases/download/[revision]/[module]-[revision]-[classifier].[ext]'
                }
                metadataSources {
                    artifact()
                }
            }
        }
        filter {
            includeModuleByRegex '[^\\.]+', 'nvidium'
        }
    }
}

java {
    withSourcesJar()
    toolchain {
        languageVersion.set(JavaLanguageVersion.of(21))
    }
}

tasks.withType(JavaCompile).configureEach {
    options.release.set(21)
}

tasks.named('processResources') {
    def commit = providers.exec {
        commandLine 'git', 'rev-parse', '--short', 'HEAD'
    }.standardOutput.asText.get().trim()
    if (commit.isEmpty()) {
        commit = '<UnknownCommit>'
    }

    def resourceProperties = [
        version  : modVersion,
        minecraft: minecraftVersion,
        commit   : commit,
        buildtime: (System.currentTimeMillis().intdiv(1000L)).toString(),
        mod_name : modName,
        mod_id   : modId,
    ]

    filesMatching('META-INF/neoforge.mods.toml') {
        expand resourceProperties
    }
}

dependencies {
    def sodiumVersion = providers.gradleProperty('sodium_version').get()
    compileOnly "net.caffeinemc:sodium-neoforge-mod:${sodiumVersion}"
    compileOnly "net.caffeinemc:sodium-neoforge-api:${sodiumVersion}"
    runtimeOnly("net.caffeinemc:sodium-neoforge:${sodiumVersion}") {
        transitive = false
    }

    implementation "maven.modrinth:lithium:${providers.gradleProperty('lithium_version').get()}"
    compileOnly "drouarb:nvidium:${providers.gradleProperty('nvidium_version').get()}"
    compileOnly "maven.modrinth:iris:${providers.gradleProperty('iris_version').get()}"
    compileOnly files('libs/modmenu-bridge-1.12.1+1.21.1.jar')
    compileOnly "me.shedaniel.cloth:cloth-config-neoforge:${providers.gradleProperty('cloth_config_version').get()}"

    runtimeOnly 'io.github.douira:glsl-transformer:2.0.1'
    runtimeOnly 'org.anarres:jcpp:1.4.14'

    def chunkyVersion = providers.gradleProperty('chunky_version').get()
    compileOnly "maven.modrinth:chunky:${chunkyVersion}"
    runtimeOnly "maven.modrinth:chunky:${chunkyVersion}"
    runtimeOnly "maven.modrinth:spark:${providers.gradleProperty('spark_version').get()}"
    compileOnly "maven.modrinth:vivecraft:${providers.gradleProperty('vivecraft_version').get()}"

    def rocksdbVersion = providers.gradleProperty('rocksdb_version').get()

    implementation "org.rocksdb:rocksdbjni:${rocksdbVersion}"

    jarJar "org.rocksdb:rocksdbjni:${rocksdbVersion}"
}

afterEvaluate {
    dependencies.add('additionalRuntimeClasspath', "org.rocksdb:rocksdbjni:${providers.gradleProperty('rocksdb_version').get()}")
}

neoForge {
    version = neoForgeVersion
    accessTransformers.from 'src/main/resources/META-INF/accesstransformer.cfg'
    validateAccessTransformers = true

    runs {
        register('client') {
            gameDirectory = file('run/')
            client()
        }
        register('server') {
            gameDirectory = file('run/')
            server()
        }
    }

    mods {
        register(modId) {
            sourceSet sourceSets.main
        }
    }
}

File deployConfigFile = file('deploy.properties')
Properties deployConfig = new Properties()
String deployBranch, deployRepoUrl, deployCheckout
boolean deployLocal
List<String> requestedTasks = gradle.startParameter.taskNames
int deployIndex = requestedTasks.findIndexOf { it == 'deploy' || it.endsWith(':deploy') }
List<String> deployTail = deployIndex < 0 ? [] : requestedTasks.drop(deployIndex + 1)
boolean deployNoCommit = deployTail.remove('--no-commit')
String deployMessage = deployTail.join(' ').trim()
if (deployIndex >= 0 && requestedTasks.size() > deployIndex + 1) {
    gradle.startParameter.setTaskNames(requestedTasks.take(deployIndex + 1))
}

def deployCommit = tasks.register('deployCommit') {
    doLast {
        if (deployNoCommit) {
            logger.lifecycle('Skipping Git commit and push (--no-commit)')
            return
        }
        Process status = new ProcessBuilder(['git', 'status', '--porcelain']).start()
        String changes = status.inputStream.text
        if (status.waitFor()) throw new GradleException('git status failed')
        List commands = []
        if (changes) {
            if (!deployMessage) {
                print 'Please write a commit message to continue the build: '
                System.out.flush()
            }
            String message = deployMessage ?: System.in.newReader().readLine()?.trim()
            if (!message) throw new GradleException('Commit message cannot be empty')
            commands.addAll([['add', '.'], ['commit', '-m', message]])
        }
        commands.add(['push', 'origin', deployBranch])
        commands.each { arguments ->
            Process git = new ProcessBuilder(['git'] + arguments).inheritIO().start()
            if (git.waitFor()) throw new GradleException("git ${arguments[0]} failed")
        }
    }
}
tasks.configureEach { if (name != 'deployCommit') mustRunAfter deployCommit }

def deploy = tasks.register('deploy', Exec) {
    description = 'Build and deploy; pass --no-commit to skip all Git operations'
    dependsOn deployCommit, jar

    doFirst {
        String host = deployConfig.getProperty('host')
        String folder = deployConfig.getProperty('folder')
        String session = deployConfig.getProperty('session')
        String window = deployConfig.getProperty('window')
        Jar jarTask = tasks.named('jar', Jar).get()
        File artifact = jarTask.archiveFile.get().asFile
        String artifactBase = jarTask.archiveBaseName.get()
        List<String> deployArguments = [session, window, folder, artifact.name, modId,
                                        deployRepoUrl, deployBranch, deployCheckout, artifactBase,
                                        Boolean.toString(deployNoCommit)]

        if (deployLocal) {
            providers.exec {
                commandLine 'cp', artifact.absolutePath, "$folder/.${modId}-deploy.jar"
            }.result.get().assertNormalExitValue()
            commandLine(['sh', '-s', '--'] + deployArguments)
        } else {
            providers.exec {
                commandLine 'scp', artifact.absolutePath, "${host}:${folder}/.${modId}-deploy.jar"
            }.result.get().assertNormalExitValue()
            List<String> quotedArguments = deployArguments.collect {
                "'${it.replace("'", "'\"'\"'")}'"
            }
            commandLine(['ssh', host, 'sh', '-s', '--'] + quotedArguments)
        }
        standardInput = new ByteArrayInputStream(file('gradle/deploy.sh').getText('UTF-8').replace('\r\n', '\n').getBytes('UTF-8'))
    }
}

gradle.taskGraph.whenReady {
    if (!it.hasTask(deploy.get())) return
    if (!deployConfigFile.exists()) deployConfigFile.setText('''configured=false
host=printer@ssh.aerosmp.com
folder=/home/printer/Desktop/Mod_Testing
session=printer_session
window=Mod_Testing
''', 'UTF-8')
    deployConfigFile.withInputStream { deployConfig.load(it) }
    if (!deployConfig.getProperty('repo')) {
        String repo = "/home/${deployConfig.getProperty('host').split('@')[0]}/Desktop"
        deployConfigFile.append("repo=$repo\n", 'UTF-8')
        deployConfig.setProperty('repo', repo)
    }
    if (deployConfig.getProperty('configured') != 'true')
        throw new GradleException("Set configured=true in ${deployConfigFile} before deploying")
    deployBranch = providers.exec { commandLine 'git', 'branch', '--show-current' }.standardOutput.asText.get().trim()
    deployRepoUrl = providers.exec { commandLine 'git', 'remote', 'get-url', 'origin' }.standardOutput.asText.get().trim()
    if (!deployBranch) throw new GradleException('deploy requires a local branch')
    String host = deployConfig.getProperty('host')
    String folder = deployConfig.getProperty('folder')
    String repoName = deployRepoUrl.tokenize('/').last().replaceFirst(/\.git$/, '')
    deployCheckout = "${deployConfig.getProperty('repo')}/$repoName"
    String targetUser = host.contains('@') ? host.substring(0, host.indexOf('@')) : System.getProperty('user.name')
    String targetHost = host.contains('@') ? host.substring(host.indexOf('@') + 1) : host
    Set<String> localHosts = ['localhost', '127.0.0.1', '::1', System.getenv('HOSTNAME'),
                              InetAddress.localHost.hostName, InetAddress.localHost.canonicalHostName]
            .findAll { it }*.toLowerCase() as Set
    deployLocal = targetUser == System.getProperty('user.name') &&
            (localHosts.contains(targetHost.toLowerCase()) ||
                    (file(folder).isDirectory() && file(deployCheckout).canonicalFile == projectDir.canonicalFile))
    logger.lifecycle(deployLocal ? "Deploy target detected locally at $folder" :
            "Deploy target detected remotely at $host:$folder")
}
