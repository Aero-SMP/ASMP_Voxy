            traverse(node);
        } else {
            atomicAdd(voxyAuditCounters[1], 1u);
        }''')
        if (!traversal.contains('VOXY_DEBUG_LOD_AUDIT_BEGIN') || !traversal.contains('voxyAuditAnomaly(node, 2u')) {
            throw new GradleException('Traversal shader audit transformation was incomplete')
        }
        File traversalOutput = outputRoot.toPath()
                .resolve('assets/voxy/shaders/lod/hierarchical/traversal.comp').toFile()
        traversalOutput.parentFile.mkdirs()
        traversalOutput.setText(traversal, 'UTF-8')

        File cmdSource = file('src/main/resources/assets/voxy/shaders/lod/gl46/cmdgen.comp')
        String cmdgen = cmdSource.getText('UTF-8')
        String cmdAnchor = '#import <voxy:lod/gl46/bindings.glsl>'
        String cmdAudit = cmdAnchor + '''

// VOXY_DEBUG_LOD_AUDIT_BEGIN
#define VOXY_DRAW_FRONTIER_CAPACITY 2048u
layout(binding = 14, std430) restrict buffer VoxyDrawAuditBuffer {
    uint voxyDrawCounters[64];
    uvec2 voxyDrawFrontier[2048];
};

void voxyDrawHash(uvec2 rawPos) {
    atomicXor(voxyDrawCounters[24], rawPos.x * 0x9e3779b9u + rawPos.y);
    atomicXor(voxyDrawCounters[25], rawPos.y * 0x85ebca6bu + rawPos.x);
    atomicAdd(voxyDrawCounters[26], rawPos.x * 0xc2b2ae35u ^ rawPos.y);
    atomicAdd(voxyDrawCounters[27], rawPos.y * 0x27d4eb2fu ^ rawPos.x);
}
// VOXY_DEBUG_LOD_AUDIT_END'''
        if (!cmdgen.contains(cmdAnchor)) throw new GradleException('Command shader audit anchor changed')
        cmdgen = cmdgen.replace(cmdAnchor, cmdAudit)
        cmdgen = cmdgen.replace('''    uint sectionId = indirectLookup[gl_GlobalInvocationID.x];
    SectionMeta meta = sectionData[sectionId];''', '''    atomicAdd(voxyDrawCounters[0], 1u);
    uint sectionId = indirectLookup[gl_GlobalInvocationID.x];
    SectionMeta meta = sectionData[sectionId];''')
        cmdgen = cmdgen.replace('''    if (shouldRender) {

        uint ptr''', '''    if (shouldRender) {
        atomicAdd(voxyDrawCounters[1], 1u);
        atomicAdd(voxyDrawCounters[16 + min(detail, 4u)], 1u);
        voxyDrawHash(extractRawPos(meta));
        if (renderTemporally) atomicAdd(voxyDrawCounters[3], 1u);
        if (voxyDrawCounters[63] != 0u) {
            uint frontierIndex = atomicAdd(voxyDrawCounters[30], 1u);
            if (frontierIndex < VOXY_DRAW_FRONTIER_CAPACITY) voxyDrawFrontier[frontierIndex] = extractRawPos(meta);
        }

        uint ptr''')
        cmdgen = cmdgen.replace('''        uint cmdCnt = bitCount(msk);
