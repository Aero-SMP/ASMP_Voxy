        if (cmdCnt != 0u) atomicAdd(voxyDrawCounters[4], 1u);
        atomicAdd(voxyDrawCounters[6], cmdCnt);
        uint cmdPtr = atomicAdd(opaqueDrawCount, cmdCnt);''')
        cmdgen = cmdgen.replace('''        if (renderTemporally) {
            tCmdPtr = atomicAdd(temporalOpaqueDrawCount, cmdCnt) + TEMPORAL_OFFSET;
        }''', '''        if (renderTemporally) {
            atomicAdd(voxyDrawCounters[8], cmdCnt);
