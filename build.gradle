plugins { id 'net.neoforged.moddev' version '2.0.141' apply false }
allprojects {
    group = 'com.aerosmp.voxy'
    version = providers.gradleProperty('mod_version').get()
    repositories {
        if (rootProject.file('.verification/maven').isDirectory()) maven { url = rootProject.uri('.verification/maven') }
        mavenCentral()
        maven { url = 'https://maven.neoforged.net/releases/' }
        maven { url = 'https://maven.caffeinemc.net/releases' }
    }
}
subprojects {
    apply plugin: 'java'
    java { toolchain.languageVersion = JavaLanguageVersion.of(21) }
    tasks.withType(JavaCompile).configureEach { options.release = 21 }
}
configure([project(':client'), project(':server')]) {
    apply plugin: 'net.neoforged.moddev'
    dependencies { implementation project(':updater'); implementation project(':terrain') }
    sourceSets.main.java.srcDir rootProject.file('shared/src/main/java')
    neoForge {
        version = providers.gradleProperty('neoforge_version').get()
        mods { register(project.name == 'client' ? 'voxy' : 'voxy_server') { sourceSet sourceSets.main } }
    }
    tasks.named('processResources') {
        def values = [version: project.version, minecraft: providers.gradleProperty('minecraft_version').get(),
                      neoforge: providers.gradleProperty('neoforge_version').get()]
        inputs.properties(values)
        filesMatching('META-INF/neoforge.mods.toml') { expand values }
    }
    tasks.named('jar') {
        archiveBaseName = 'voxy-rewrite-' + project.name
        archiveClassifier = 'debug'
        from project(':updater').sourceSets.main.output
        from project(':terrain').sourceSets.main.output
        manifest.attributes('Implementation-Version': project.version,
                            'Voxy-Update-Build': providers.gradleProperty('mod_build').get(),
                            'Voxy-Update-Side': project.name)
    }
}
project(':terrain') {
    dependencies {
        compileOnly 'org.lwjgl:lwjgl-zstd:3.3.3'
        compileOnly 'tech.kwik:kwik:0.10.10'
    }
}
project(':client') {
    dependencies { compileOnly 'net.caffeinemc:sodium-neoforge-api:0.8.12+mc1.21.1' }
    configurations { embedded }
    dependencies {
        compileOnly 'tech.kwik:kwik:0.10.10'
        compileOnly 'org.lwjgl:lwjgl-zstd:3.3.3'
        embedded 'tech.kwik:kwik:0.10.10'
        embedded 'tech.kwik:agent15:3.2'
        embedded 'at.favre.lib:hkdf:2.0.0'
        embedded 'io.whitfin:siphash:3.0.0'
        embedded 'org.lwjgl:lwjgl-zstd:3.3.3'
        ['natives-linux', 'natives-linux-arm64', 'natives-macos', 'natives-macos-arm64',
         'natives-windows', 'natives-windows-arm64', 'natives-windows-x86'].each {
            embedded "org.lwjgl:lwjgl-zstd:3.3.3:${it}"
        }
    }
    tasks.named('jar') {
        from({ configurations.embedded.collect { zipTree(it) } }) {
            include 'org/lwjgl/util/zstd/**', 'linux/**', 'macos/**', 'windows/**',
                    'META-INF/linux/**', 'META-INF/macos/**', 'META-INF/windows/**',
                    'tech/kwik/**', 'at/favre/lib/hkdf/**', 'io/whitfin/siphash/**'
        }
        duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    }
}
tasks.register('buildNative', Exec) {
    workingDir = file('rust-server')
    commandLine 'cargo', 'build', '--offline', '--locked', '--release'
    inputs.files(fileTree('rust-server/src'), file('rust-server/Cargo.toml'), file('rust-server/Cargo.lock'))
    outputs.file('rust-server/target/release/voxy-rewrite-server')
}
project(':server').tasks.named('processResources') {
    dependsOn rootProject.tasks.named('buildNative')
    from(rootProject.file('rust-server/target/release/voxy-rewrite-server')) { into 'native/linux-x86_64' }
}
project(':updater') {
    def generated = layout.buildDirectory.dir('generated/sources/buildInfo')
    sourceSets.main.java.srcDir generated
    tasks.register('generateBuildInfo') {
        inputs.property('build', providers.gradleProperty('mod_build'))
        outputs.dir generated
        doLast {
            def number = providers.gradleProperty('mod_build').get().toLong()
            if (number < 0) throw new GradleException('mod_build must be nonnegative')
            def output = generated.get().file('com/aerosmp/voxy/update/BuildInfo.java').asFile
            output.parentFile.mkdirs()
            output.text = "package com.aerosmp.voxy.update; public final class BuildInfo { public static final long BUILD = ${number}L; private BuildInfo() {} }\n"
        }
    }
    tasks.named('compileJava') { dependsOn 'generateBuildInfo' }
}
tasks.register('buildAll') { dependsOn ':client:jar', ':server:jar' }
