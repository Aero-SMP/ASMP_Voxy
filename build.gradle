import org.gradle.api.tasks.compile.JavaCompile

plugins {
    id 'net.neoforged.moddev' version '2.0.141'
}

def modVersion = providers.gradleProperty('mod_version').get()
def minecraftVersion = providers.gradleProperty('minecraft_version').get()
def neoForgeVersion = providers.gradleProperty('neoforge_version').get()
def modId = providers.gradleProperty('mod_id').get()
def modName = providers.gradleProperty('mod_name').get()

group = providers.gradleProperty('maven_group').get()
version = "${modVersion}+${minecraftVersion}-neoforge"

base {
    archivesName.set("ASMP_${modId}")
}

repositories {
    mavenCentral()
    maven { url = 'https://maven.caffeinemc.net/releases' }
    exclusiveContent {
        forRepository {
            maven {
                name = 'Modrinth'
                url = 'https://api.modrinth.com/maven'
            }
        }
        filter {
            includeGroup 'maven.modrinth'
        }
    }

    exclusiveContent {
        forRepository {
            ivy {
                name = 'GitHub releases'
                url = 'https://github.com/'
                patternLayout {
                    artifact '/[organisation]/[module]/releases/download/[revision]/[module]-[revision]-[classifier].[ext]'
                }
                metadataSources {
                    artifact()
                }
            }
        }
        filter {
            includeModuleByRegex '[^\\.]+', 'nvidium'
        }
    }
}

java {
    toolchain {
        languageVersion.set(JavaLanguageVersion.of(21))
    }
}

sourceSets.main.java.srcDir 'bridge-shared/src/main/java'

sourceSets {
    debug {
        java.srcDirs = ['src/debug/java', 'bridge-shared/src/debug/java']
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
        runtimeClasspath += output + sourceSets.main.runtimeClasspath
    }
    debugTest {
        java.srcDirs = ['src/debugTest/java']
        resources.srcDirs = []
        compileClasspath += sourceSets.main.output + sourceSets.debug.output + sourceSets.test.output
        runtimeClasspath += output + compileClasspath
    }
}

configurations {
    clientEmbedded {
        canBeConsumed = false
        canBeResolved = true
        transitive = false
    }
    debugTestImplementation.extendsFrom testImplementation
    debugTestRuntimeOnly.extendsFrom testRuntimeOnly
}

tasks.withType(JavaCompile).configureEach {
    options.release.set(21)
}

tasks.named('processResources') {
    def commit = providers.exec {
        commandLine 'git', 'rev-parse', '--short', 'HEAD'
    }.standardOutput.asText.get().trim()
    if (commit.isEmpty()) {
        commit = '<UnknownCommit>'
    }

    def resourceProperties = [
        version  : modVersion,
        minecraft: minecraftVersion,
        commit   : commit,
        buildtime: (System.currentTimeMillis().intdiv(1000L)).toString(),
        mod_name : modName,
        mod_id   : modId,
    ]

    filesMatching('META-INF/neoforge.mods.toml') {
        expand resourceProperties
    }
}

dependencies {
    def sodiumVersion = providers.gradleProperty('sodium_version').get()
    def testOs = System.getProperty('os.name').toLowerCase(Locale.ROOT)
    def testPlatform = testOs.contains('win') ? 'windows' : testOs.contains('mac') ? 'macos' : 'linux'
    def testArch = System.getProperty('os.arch').toLowerCase(Locale.ROOT)
    def lwjglNatives = "natives-${testPlatform}${testArch in ['aarch64', 'arm64'] ? '-arm64' : ''}"
    compileOnly "net.caffeinemc:sodium-neoforge-mod:${sodiumVersion}"
    compileOnly "net.caffeinemc:sodium-neoforge-api:${sodiumVersion}"
    runtimeOnly("net.caffeinemc:sodium-neoforge:${sodiumVersion}") {
        transitive = false
    }

    compileOnly "drouarb:nvidium:${providers.gradleProperty('nvidium_version').get()}"
    compileOnly "maven.modrinth:iris:${providers.gradleProperty('iris_version').get()}"
    runtimeOnly 'io.github.douira:glsl-transformer:2.0.1'
    runtimeOnly 'org.anarres:jcpp:1.4.14'
    implementation 'io.airlift:aircompressor:0.27'
    clientEmbedded 'io.airlift:aircompressor:0.27'
    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testImplementation 'it.unimi.dsi:fastutil:8.5.12'
    testRuntimeOnly 'org.lwjgl:lwjgl:3.3.3'
    testRuntimeOnly "org.lwjgl:lwjgl:3.3.3:${lwjglNatives}"
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

def addEmbeddedClientClasses = { Jar task ->
    task.from({ configurations.clientEmbedded.collect { zipTree(it) } }) {
        include 'io/airlift/compress/zstd/**', 'io/airlift/compress/Decompressor.class',
                'io/airlift/compress/MalformedInputException.class',
                'io/airlift/compress/IncompatibleJvmException.class'
        exclude 'module-info.class', 'META-INF/MANIFEST.MF', 'META-INF/*.SF',
                'META-INF/*.RSA', 'META-INF/*.DSA'
    }
    task.duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

tasks.named('jar', Jar) { task ->
    addEmbeddedClientClasses(task)
}

tasks.named('test') {
    dependsOn tasks.named('debugTestClasses')
    testClassesDirs += sourceSets.debugTest.output.classesDirs
    classpath += sourceSets.debugTest.output + sourceSets.debug.output
    useJUnitPlatform()
}

def generatedDebugResources = layout.buildDirectory.dir('generated/voxyDebugResources')

tasks.register('generateDebugResources') {
    description = 'Generate debug-only metadata and instrumented LOD audit shaders'
    dependsOn tasks.named('processResources')
    inputs.files(
            'src/main/resources/assets/voxy/shaders/lod/hierarchical/traversal.comp',
            'src/main/resources/assets/voxy/shaders/lod/gl46/cmdgen.comp',
            'src/main/resources/META-INF/neoforge.mods.toml')
    outputs.dir generatedDebugResources

    doLast {
        File outputRoot = generatedDebugResources.get().asFile
        project.delete(outputRoot)

        File processedMetadata = sourceSets.main.output.resourcesDir.toPath()
                .resolve('META-INF/neoforge.mods.toml').toFile()
        File debugMetadata = outputRoot.toPath().resolve('META-INF/neoforge.mods.toml').toFile()
        debugMetadata.parentFile.mkdirs()
        debugMetadata.text = processedMetadata.getText('UTF-8') +
                '\n[[mixins]]\nconfig="debug.voxy.mixins.json"\n'

        [
                'assets/voxy/shaders/lod/hierarchical/traversal.comp',
                'assets/voxy/shaders/lod/gl46/cmdgen.comp'
        ].each { path ->
            File source = file("src/main/resources/${path}")
            String shader = source.getText('UTF-8')
            if (!shader.startsWith('#version') || !shader.contains('VOXY_DEBUG_LOD_AUDIT_BEGIN')) {
                throw new GradleException("Debug shader anchors changed: ${path}")
            }
            shader = shader.replaceFirst('\n', '\n#define VOXY_DEBUG_LOD_AUDIT\n')
            File output = outputRoot.toPath().resolve(path).toFile()
            output.parentFile.mkdirs()
            output.setText(shader, 'UTF-8')
        }
    }
}

sourceSets.debug.resources.srcDir generatedDebugResources
tasks.named('processDebugResources') {
    dependsOn tasks.named('generateDebugResources')
}

tasks.register('debugJar', Jar) {
    description = 'Build the client JAR with bounded remote diagnostics enabled'
    archiveClassifier.set('debug')
    dependsOn tasks.named('debugClasses')
    from(sourceSets.main.output) {
        exclude 'me/cortex/voxy/client/lod/ClientLodDebug.class'
        exclude 'META-INF/neoforge.mods.toml'
        exclude 'assets/voxy/shaders/lod/hierarchical/traversal.comp'
        exclude 'assets/voxy/shaders/lod/gl46/cmdgen.comp'
    }
    from sourceSets.debug.output
    from layout.projectDirectory.dir('debug-marker')
    addEmbeddedClientClasses(delegate)
}

tasks.register('verifyDebugIsolation') {
    description = 'Verify that debug-only audit code and resources do not enter the normal JAR'
    group = 'verification'
    dependsOn tasks.named('jar'), tasks.named('debugJar')
    doLast {
        File normalJar = tasks.named('jar').get().archiveFile.get().asFile
        File diagnosticJar = tasks.named('debugJar').get().archiveFile.get().asFile
        Set<String> normalEntries = zipTree(normalJar).matching {
            include '**/*LodAudit*', '**/DetailDecision*', '**/DetailStateMachine*',
                    '**/Mixin*Debug*', 'debug.voxy.mixins.json',
                    'assets/voxy/shaders/debug/**'
        }.files.collect { it.name } as Set
        if (!normalEntries.isEmpty()) {
            throw new GradleException("Debug audit entries leaked into normal JAR: ${normalEntries}")
        }
        def debugTree = zipTree(diagnosticJar)
        ['debug.voxy.mixins.json',
         'assets/voxy/shaders/debug/missing_roots.comp',
         'assets/voxy/shaders/lod/hierarchical/traversal.comp',
         'assets/voxy/shaders/lod/gl46/cmdgen.comp'].each { entry ->
            if (debugTree.matching { include entry }.isEmpty()) {
                throw new GradleException("Debug JAR is missing ${entry}")
            }
        }
        File mixinConfigFile = debugTree.matching { include 'debug.voxy.mixins.json' }.singleFile
        Map<String, Object> mixinConfig = new groovy.json.JsonSlurper()
                .parse(mixinConfigFile) as Map<String, Object>
        String debugMixinPackage = 'me.cortex.voxy.debug.mixin'
        if (mixinConfig.package != debugMixinPackage) {
            throw new GradleException("Debug Mixins must use the isolated ${debugMixinPackage} package; " +
                    "a broader package makes Mixin reject ordinary Voxy classes at runtime")
        }
        List<String> configuredMixins = []
        ['mixins', 'client', 'server'].each { side ->
            configuredMixins.addAll((mixinConfig[side] ?: []) as Collection<String>)
        }
        configuredMixins.each { mixin ->
            String entry = debugMixinPackage.replace('.', '/') + '/' + mixin + '.class'
            if (debugTree.matching { include entry }.isEmpty()) {
                throw new GradleException("Debug Mixin config references missing class ${entry}")
            }
        }
        if (!fileTree('src/main/java').matching {
            include debugMixinPackage.replace('.', '/') + '/**'
        }.isEmpty()) {
            throw new GradleException("Production sources must not use the reserved debug Mixin package")
        }
        ['assets/voxy/shaders/lod/hierarchical/traversal.comp',
         'assets/voxy/shaders/lod/gl46/cmdgen.comp'].each { entry ->
            byte[] packaged = zipTree(normalJar).matching { include entry }.singleFile.bytes
            byte[] source = file("src/main/resources/${entry}").bytes
            if (!java.util.Arrays.equals(packaged, source)) {
                throw new GradleException("Normal JAR shader changed while packaging ${entry}")
            }
            String diagnostic = zipTree(diagnosticJar).matching { include entry }.singleFile.getText('UTF-8')
            if (!diagnostic.contains('VOXY_DEBUG_LOD_AUDIT_BEGIN')) {
                throw new GradleException("Debug JAR shader is not instrumented: ${entry}")
            }
        }
    }
}

tasks.named('check') {
    dependsOn tasks.named('verifyDebugIsolation')
}

tasks.named('assemble') {
    dependsOn tasks.named('debugJar')
}

neoForge {
    version = neoForgeVersion
    accessTransformers.from 'src/main/resources/META-INF/accesstransformer.cfg'
    validateAccessTransformers = true

    runs {
        register('client') {
            gameDirectory = file('run/')
            client()
        }
    }

    mods {
        register(modId) {
            sourceSet sourceSets.main
        }
    }

    unitTest {
        testedMod = mods.getByName(modId)
        enable()
    }
}

tasks.register('buildRustServer', Exec) {
    description = 'Build the standalone Rust LOD server'
    workingDir 'rust-server'
    commandLine 'cargo', 'build', '--release', '--locked'
    inputs.files 'rust-server/Cargo.toml', 'rust-server/Cargo.lock'
    inputs.dir 'rust-server/src'
    outputs.file 'rust-server/target/release/voxy-rust-server'
}

tasks.register('buildAll') {
    description = 'Build the Java client mod and Rust server'
    dependsOn tasks.named('build'), tasks.named('buildRustServer'), ':bridge:build'
}
