plugins {
    id 'net.neoforged.moddev' version '2.0.141'
}

group = rootProject.group
version = rootProject.version
def minecraftVersion = providers.gradleProperty('minecraft_version').get()
def neoForgeVersion = providers.gradleProperty('neoforge_version').get()
def modVersion = providers.gradleProperty('mod_version').get()

base {
    archivesName.set('voxy-server')
}

java {
    toolchain.languageVersion.set(JavaLanguageVersion.of(21))
}

sourceSets.main.java.srcDir rootProject.file('shared/src/main/java')
sourceSets {
    debug {
        java.srcDirs = ['src/debug/java', rootProject.file('shared/src/debug/java')]
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
    }
    pressureChecks {
        java.srcDirs = ['src/debugTest/java']
        compileClasspath += sourceSets.debug.output + sourceSets.debug.compileClasspath
        runtimeClasspath += output + compileClasspath
    }
}

repositories { mavenCentral() }

tasks.withType(JavaCompile).configureEach {
    options.release.set(21)
}

tasks.named('processResources') {
    dependsOn rootProject.tasks.named('buildRustServer')
    def resourceProperties = [
            version: project.version,
            minecraft: minecraftVersion,
            neoforge: neoForgeVersion,
    ]
    inputs.properties(resourceProperties)
    from(rootProject.file('rust-server/target/normal/release/voxy-rust-server')) {
        into 'native/linux-x86_64'
    }
    filesMatching('META-INF/neoforge.mods.toml') {
        expand(resourceProperties)
    }
}

tasks.named('jar', Jar) {
    manifest.attributes('Implementation-Version': modVersion)
}

tasks.register('debugJar', Jar) {
    dependsOn rootProject.tasks.named('buildRustServerDebug')
    description = 'Build the server controller with QUIC diagnostics enabled'
    archiveClassifier.set('debug')
    manifest.attributes('Implementation-Version': modVersion)
    from(sourceSets.main.output) {
        exclude 'me/cortex/voxy/server/ServerDebug.class'
        exclude 'META-INF/neoforge.mods.toml'
        exclude 'native/linux-x86_64/voxy-rust-server'
    }
    from sourceSets.debug.output
    from(rootProject.file('rust-server/target/debug-diagnostics/release/voxy-rust-server')) {
        into 'native/linux-x86_64'
    }
    from('src/main/resources/META-INF/neoforge.mods.toml') {
        into 'META-INF'
        expand(version: project.version, minecraft: minecraftVersion, neoforge: neoForgeVersion)
        filter { line -> line == 'config="server.voxy.mixins.json"' ? line + '\n\n[[mixins]]\nconfig="server.voxy.debug.mixins.json"' : line }
    }
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

tasks.named('assemble') {
    dependsOn tasks.named('debugJar')
}

tasks.register('pressureControlChecks', JavaExec) {
    description = 'Focused pressure deadline, owned IPC framing and cleanup-acknowledgment checks'
    classpath = sourceSets.pressureChecks.runtimeClasspath
    mainClass.set('me.cortex.voxy.server.LivePressureRoutesChecks')
}

neoForge {
    version = neoForgeVersion
    mods {
        register('voxy_server') {
            sourceSet sourceSets.main
        }
    }
}
