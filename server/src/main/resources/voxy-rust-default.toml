# World: ./world with standard dimension folders. Generated data: ./voxy-data.
# Saved terrain is checked every two seconds once background work is caught up.
# Zero lets Rayon choose its default worker count.
rayon_threads = 0

[quic]
# Empty uses 0.0.0.0:(current Minecraft server-port + 200) on every backend start.
# Set an explicit address such as "0.0.0.0:25786" to override automatic selection.
listen = ""
# Empty uses the Minecraft server address and bound UDP port.
# Overrides: "lod.example.com", ":30000", "lod.example.com:30000", "[2001:db8::1]:30000".
advertise = ""
