pluginManagement {
    repositories {
        gradlePluginPortal()
        mavenCentral()
        maven { url = 'https://maven.neoforged.net/releases/' }
    }
}

rootProject.name = 'Voxy'

def includeDebug = gradle.startParameter.projectProperties
        .getOrDefault('includeDebug', 'false')
        .toBoolean()
if (includeDebug) {
    include 'debug'
}
